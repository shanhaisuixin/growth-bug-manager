name: 生成安卓签名密钥（免费，只跑一次）

# 安卓要出「正式签名包」，得有一把密钥（keystore）。
# 正常做法是在自己电脑上用 JDK 自带的 keytool 生成 —— 本机没装 JDK，
# 但这台机器上的 GitHub 运行器**自带 JDK**，跑一次就有一把密钥，一分钱不花。
#
# 用法：
#   1. Actions 页面 → 左边选这个流程 → Run workflow（填个名字和别名就行）
#   2. 跑完下载那个叫 gbm-signing-xxx 的压缩包
#   3. 把里面的四个值贴到仓库 Settings → Secrets and variables → Actions
#      ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
#      ANDROID_KEY_ALIAS      / ANDROID_KEY_PASSWORD
#   4. **回到这次运行，把 Artifacts 和这条运行记录都删掉**
#      （仓库转公开之后，日志和产物是所有人都能下载的）
#   5. 之后再推代码，出包那条流程就会自动签成正式包
#
# 为什么密码是流程自己随机的，不让你填：
#   workflow_dispatch 的输入会显示在运行的摘要里，等于把密码写在明面上。
#   让它内部生成、只写进压缩包，整个过程密码不出现在任何日志里。
#
# ⚠️ 这把密钥一旦用于发版就**不能换**。换签名＝用户必须先卸载再装，
#    而卸载＝记录全部没了。所以那个压缩包请自己多存一份。

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: '密钥别名（随便起一个英文名就行）'
        required: false
        default: 'gbm'
      validity_days:
        description: '有效期（天）'
        required: false
        default: '10950'
      dname:
        description: '证书上的名字（随便填，不上架就没人查）'
        required: false
        default: 'CN=GBM, O=GBM, C=CN'

permissions:
  contents: read

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: 用运行器自带的 JDK 生成密钥
        run: |
          set -e
          ALIAS="${{ github.event.inputs.key_alias }}"
          DAYS="${{ github.event.inputs.validity_days }}"
          DNAME="${{ github.event.inputs.dname }}"

          # 两个密码都在容器里随机生成，不进日志
          STORE_PASS=$(openssl rand -base64 24 | tr -d '\n')
          KEY_PASS=$(openssl rand -base64 24 | tr -d '\n')

          keytool -genkeypair -v \
            -keystore gbm.keystore \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity "$DAYS" \
            -dname "$DNAME" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS"

          echo "OK 密钥生成好了（别名 $ALIAS，有效期 $DAYS 天）"

          # base64 成一行，方便直接贴进 Secret
          base64 -w 0 gbm.keystore > keystore.base64

          cat > 四个值-贴到仓库Secrets.txt <<EOF
          把这四行分别建到仓库的 Settings → Secrets and variables → Actions 里。
          名字照抄左边的，值照抄右边的（值里不要带空格）。

          ANDROID_KEYSTORE_BASE64      = $(cat keystore.base64)

          ANDROID_KEYSTORE_PASSWORD    = $STORE_PASS

          ANDROID_KEY_ALIAS            = $ALIAS

          ANDROID_KEY_PASSWORD         = $KEY_PASS

          --------------------------------------------------
          贴完之后，回到 Actions 这次运行，把下面的压缩包和这条运行记录
          都删掉 —— 仓库转公开之后，产物是所有人都能下载的。

          再往后推代码，出包那条流程会自动改成签正式包（不用改任何代码）。

          ⚠️ 这把密钥一旦发出去就不能换了：换签名＝用户得先卸载再装，
             而卸载＝记录全部清空。这个文件请自己另外存一份。
          EOF

          mkdir -p out
          cp keystore.base64 "四个值-贴到仓库Secrets.txt" out/
          cp gbm.keystore out/gbm.keystore
          zip -j -P "$STORE_PASS" out/gbm-signing.zip \
              out/keystore.base64 out/"四个值-贴到仓库Secrets.txt"

      - name: 把密钥打包传上来（下载后请删掉这次运行）
        uses: actions/upload-artifact@v4
        with:
          name: gbm-signing-${{ github.run_number }}
          path: out/
          if-no-files-found: error

      - name: 提醒
        run: |
          echo ""
          echo "======================================================="
          echo " 密钥已经生成，在 Artifacts 里的 gbm-signing-${{ github.run_number }}。"
          echo ""
          echo " 下一步："
          echo "   1) 下载那个压缩包，把四个值贴进仓库 Secrets"
          echo "   2) 回头把这次运行的 Artifacts 和运行记录都删掉"
          echo "      （仓库转公开后，日志和产物是所有人都能下载的）"
          echo "   3) 压缩包里那份 gbm.keystore 自己多存一份，丢了就没法更新了"
          echo "======================================================="
